version: '3'

services:

  app:
    build: .
    container_name: multi-container-app

    restart: always

    depends_on:
      - redis

  redis:
    image: redis:latest

    container_name: redis-server

    restart: always

  nginx:
    image: nginx:latest

    container_name: nginx-proxy

    ports:
      - "80:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - app
